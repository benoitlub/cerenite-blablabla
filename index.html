<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b19"><title>Cérénité Blablabla — BNN24</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#252044 0%,#111226 48%,#080a15 100%);color:#f5efff;min-height:100dvh}.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 22px)}header{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-size:12px;letter-spacing:.15em;color:#aaa5c7}header b{color:#72e4f0}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;width:100%;max-width:600px}.orb{width:min(60vw,230px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d8ff 0%,#bba4ec 18%,#7772cd 42%,#3a327f 66%,#161735 80%);box-shadow:0 0 45px #8e72dd55,0 0 100px #4bcbd522;animation:breathe 5s ease-in-out infinite;transition:filter .2s}.orb.speaking{animation:breathe 1.2s ease-in-out infinite;filter:brightness(1.25)}.orb.listening{box-shadow:0 0 65px #52dbe5aa,0 0 130px #52dbe544} @keyframes breathe{50%{transform:scale(1.07)}}.line{height:5.1em;min-height:5.1em;overflow:hidden;max-width:440px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.55;font-size:clamp(17px,4.5vw,22px);font-weight:300;mask-image:linear-gradient(to bottom,transparent 0%,black 16%,black 86%,transparent 100%)}.line .caption{max-width:100%;transition:opacity .2s,transform .2s;animation:caption-in .3s ease-out}@keyframes caption-in{from{opacity:.4;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.hint{text-align:center;color:#aca7c8;font-size:13px;min-height:20px}footer{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:520px}.avatar{width:80px;height:80px;border-radius:50%;border:2px solid #b477d5;background:radial-gradient(circle at 40% 25%,#39c8d3,#44295f 65%,#130d27);box-shadow:0 0 25px #ad5acb55;display:grid;place-items:center;color:#fff;font-size:27px;cursor:pointer}.avatar:focus-visible,button:focus-visible{outline:3px solid #8ee9ee;outline-offset:3px}.avatar[aria-pressed=true]{border-color:#66f0ec;box-shadow:0 0 30px #60ecee88}.controls{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}button{font:inherit} .small{background:transparent;color:#bcb5d4;border:1px solid #56506c;border-radius:22px;padding:9px 13px;cursor:pointer}.inputbar{display:flex;gap:8px;width:100%;margin-top:8px}.inputbar input{flex:1;min-width:0;border:1px solid #595171;border-radius:22px;padding:12px 16px;background:#1a1930;color:white;font:inherit}.inputbar button{border:0;border-radius:22px;background:#7861b2;color:white;padding:10px 17px;cursor:pointer}.note{font-size:11px;color:#88829f;text-align:center;max-width:440px;line-height:1.5}
</style></head><body><div class="app"><header><span><b>BNN24</b> · LIVE FROM MY BRAIN</span><span>FEUCH LAB</span></header><main><div id="orb" class="orb" aria-hidden="true"></div><div class="line" id="reply" aria-live="polite">Bonsoir, je suis Cérénité Blablabla. Qu'est-ce qui traverse ton ciel aujourd'hui ?</div><div class="hint" id="status" role="status">Appuie sur mon portrait pour parler.</div></main><footer><button class="avatar" id="mic" aria-label="Parler à Cérénité" aria-pressed="false">✧</button><div class="controls"><button class="small" id="config">Connecter Mistral</button><button class="small" id="voicePick">Changer de voix</button><button class="small" id="mute">Couper la voix</button><button class="small" id="stop">Arrêter</button></div><form class="inputbar" id="form"><input id="message" autocomplete="off" aria-label="Écrire à Cérénité" placeholder="Ou écris-moi quelques mots…"><button type="submit">Envoyer</button></form><div class="note">Conversation Mistral via Publisher après connexion privée. Mode local de secours. Ce n'est pas un dispositif médical ni une thérapie.</div></footer></div>
<script>
const reply=document.querySelector('#reply'),status=document.querySelector('#status'),orb=document.querySelector('#orb'),mic=document.querySelector('#mic'),mute=document.querySelector('#mute'),stop=document.querySelector('#stop'),form=document.querySelector('#form'),message=document.querySelector('#message');
let captionTimer=null,captionRun=0,selectedVoiceURI="",voiceStyle=0,voiceOn=true,recognition=null,active=false,endpoint="https://blacklace-publisher-worker.benoitlubert.workers.dev/api/cerenite/chat",code="",pending=null;const history=[];
const rules=[
{test:/bonjour|salut|bonsoir|coucou/i,answers:["Bonjour ! Ici BNN24, où les pensées ont parfois une météo imprévisible.","Te voilà ! J'avais justement laissé une petite place au hasard."]},
{test:/stress|angoiss|anxie|inquiet|peur|tendu/i,answers:["Et si cette inquiétude était un nuage, de quelle couleur serait-il ? Tu peux simplement le décrire.","Il y a parfois du vent à l'intérieur. Tu n'as rien à réussir ici."]},
{test:/dorm|sommeil|fatigu|nuit/i,answers:["La nuit n'exige aucune performance. On peut juste laisser la journée déposer ses valises.","Tu préfères une petite image paisible, ou simplement quelques mots ?"]},
{test:/créa|idée|invent|imagin|inspir/i,answers:["Imagine une porte qui s'ouvre sur une idée complètement inutile… et merveilleuse. Que vois-tu ?","Parfois, une idée arrive déguisée en bêtise. Tu en as croisé une aujourd'hui ?"]},
{test:/hypnos|emdr|yeux|relax/i,answers:["Nous pouvons explorer l'imagination et l'attention, sans promettre de transformer ton cerveau. Quel paysage t'apaise ?","Pour l'instant, je peux te proposer une image mentale douce, sans protocole thérapeutique."]},
{test:/trist|seul|solitude|mal/i,answers:["Je t'écoute. Tu peux raconter ce qui pèse, sans avoir besoin de le rendre joli.","Même les jours gris ont droit à une place dans le bulletin météo du cerveau."]},
{test:/merci/i,answers:["Avec plaisir. Les mots ont parfois de drôles de petites ailes."]}
];
const other=["Raconte-moi un peu plus. Je préfère découvrir ton paysage plutôt que le dessiner à ta place.","Si cette pensée était un lieu, à quoi ressemblerait-il ?","Je t'écoute. Qu'est-ce qui te semble important là-dedans ?"];
let index=0;
function choose(a){return a[(index++)%a.length]}
function setStatus(s){status.textContent=s}
function speechOnly(text){return text.replace(/\*[^*\n]{1,180}\*/g,' ').replace(/_[^_\n]{1,180}_/g,' ').replace(/\*{1,3}/g,'').replace(/\s+/g,' ').trim()}
function frenchVoices(){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>/^fr(?:-|$)/i.test(v.lang))}
const voiceStyles=[
 {name:"Naturelle",rate:.93,pitch:1.03},
 {name:"Velours nocturne",rate:.83,pitch:.84},
 {name:"Radio malicieuse",rate:1.08,pitch:1.16},
 {name:"Douce et posée",rate:.82,pitch:1.1}
];
function selectVoice(){
 if(!('speechSynthesis' in window)){setStatus("Synthèse vocale indisponible.");return}
 const voices=frenchVoices();
 if(voices.length>1){
  const current=voices.findIndex(v=>v.voiceURI===selectedVoiceURI);
  const next=voices[(current+1)%voices.length];selectedVoiceURI=next.voiceURI;
  setStatus("Voix : "+next.name+" — "+next.lang);
 }else{
  voiceStyle=(voiceStyle+1)%voiceStyles.length;
  setStatus("Style vocal : "+voiceStyles[voiceStyle].name+" (voix Android par défaut)");
 }
 speak("Bonsoir ! Ici Cérénité Blablabla. Comment trouvez-vous ma nouvelle voix ?");
}
document.querySelector('#voicePick').addEventListener('click',selectVoice);
if('speechSynthesis' in window){speechSynthesis.addEventListener('voiceschanged',()=>{if(selectedVoiceURI&&!frenchVoices().some(v=>v.voiceURI===selectedVoiceURI))selectedVoiceURI=""})}
function stopCaptions(){captionRun++;if(captionTimer!==null){clearInterval(captionTimer);captionTimer=null}}
function showCaption(text,position){
 const words=text.slice(0,Math.max(0,position)).trim().split(/\\s+/);
 const visible=words.slice(-18).join(" ");
 reply.replaceChildren();
 const line=document.createElement("span");line.className="caption";line.textContent=visible;
 reply.appendChild(line);
}
function animateCaptions(text,utterance){
 stopCaptions();const run=captionRun;
 const duration=Math.max(1800,text.length*68/Math.max(.5,utterance.rate));
 const started=performance.now();let boundary=-1;
 showCaption(text,0);
 utterance.onboundary=e=>{if(run!==captionRun)return;if(typeof e.charIndex==="number"){boundary=Math.max(boundary,e.charIndex+(e.charLength||1));showCaption(text,boundary)}};
 captionTimer=setInterval(()=>{
  if(run!==captionRun)return;
  if(boundary>=0)return; // Speech engine supplies real timing.
  const elapsed=performance.now()-started;
  showCaption(text,Math.min(text.length,Math.floor(text.length*elapsed/duration)));
 },90);
 utterance.onend=()=>{if(run!==captionRun)return;stopCaptions();showCaption(text,text.length);orb.classList.remove('speaking')};
 utterance.onerror=()=>{if(run!==captionRun)return;stopCaptions();showCaption(text,text.length);orb.classList.remove('speaking')};
}
function speak(text){
 const spoken=speechOnly(text);
 if(!spoken)return;
 if(!voiceOn||!('speechSynthesis' in window)){stopCaptions();showCaption(spoken,spoken.length);return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(spoken);u.lang='fr-FR';
 const chosen=frenchVoices().find(v=>v.voiceURI===selectedVoiceURI);
 if(chosen){u.voice=chosen;u.lang=chosen.lang}
 u.rate=voiceStyles[voiceStyle].rate;u.pitch=voiceStyles[voiceStyle].pitch;
 u.onstart=()=>orb.classList.add('speaking');
 animateCaptions(spoken,u);speechSynthesis.speak(u);
}

async function respond(input){
const t=input.trim().slice(0,500);if(!t)return;
if(pending)pending.abort();const controller=new AbortController();pending=controller;
if(endpoint&&code){
stopCaptions();reply.textContent="…";setStatus("Cérénité réfléchit…");
try{
const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","X-Cerenite-Access":code},body:JSON.stringify({message:t,history:history.slice(-10)}),signal:controller.signal});
if(!res.ok)throw new Error("HTTP "+res.status);
const data=await res.json();if(typeof data.reply!=="string")throw new Error("Réponse invalide");
const answer=data.reply.slice(0,1100);history.push({role:"user",content:t},{role:"assistant",content:answer});if(history.length>12)history.splice(0,history.length-12);
setStatus("Réponse Mistral.");speak(answer);pending=null;return;
}catch(e){if(e.name==="AbortError")return;setStatus("Mistral indisponible, réponse locale.");}finally{if(pending===controller)pending=null}
}
const rule=rules.find(r=>r.test.test(t));const answer=choose(rule?rule.answers:other);speak(answer)
}
function reset(){active=false;mic.setAttribute('aria-pressed','false');orb.classList.remove('listening');}
document.querySelector('#config').addEventListener('click',()=>{
const c=prompt("Code privé CERENITE_ACCESS_CODE configuré dans Cloudflare (pas la clé API Mistral)");if(!c)return;
code=c;history.length=0;setStatus("Cérénité connectée à Publisher. Envoie un message pour tester.");
});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){recognition=new SR();recognition.lang='fr-FR';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{reset();respond(e.results[0][0].transcript)};recognition.onerror=e=>{reset();setStatus(e.error==='not-allowed'?'Micro refusé : utilise le champ texte.':'Reconnaissance indisponible : utilise le champ texte.')};recognition.onend=()=>{if(active){reset();setStatus('Appuie pour reparler.')}}}
mic.addEventListener('click',()=>{if(!recognition){setStatus('Reconnaissance vocale indisponible sur ce navigateur. Écris-moi ci-dessous.');message.focus();return}if(active){recognition.stop();reset();setStatus('Écoute arrêtée.');return}if('speechSynthesis' in window)speechSynthesis.cancel();try{recognition.start();active=true;mic.setAttribute('aria-pressed','true');orb.classList.add('listening');setStatus('Je t’écoute…')}catch(e){reset();setStatus('Micro indisponible. Utilise le texte.')}});
form.addEventListener('submit',e=>{e.preventDefault();respond(message.value);message.value=''});
mute.addEventListener('click',()=>{voiceOn=!voiceOn;mute.textContent=voiceOn?'Couper la voix':'Activer la voix';if(!voiceOn&&'speechSynthesis' in window){speechSynthesis.cancel();stopCaptions()}orb.classList.remove('speaking')});
stop.addEventListener('click',()=>{if(pending)pending.abort();stopCaptions();history.length=0;if(active&&recognition)recognition.abort();reset();if('speechSynthesis' in window)speechSynthesis.cancel();orb.classList.remove('speaking');setStatus('À bientôt, voyageur des pensées.')});
</script></body></html>
